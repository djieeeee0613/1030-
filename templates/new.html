{% extends 'base.html' %}{% block content %}<div class="wrap narrow"><a href="/" class="back">← 返回活動列表</a><span class="kicker">CREATE NEW EVENT</span><h1>建立新活動</h1><div class="panel"><p class="muted">填寫活動資訊，讓大家可以直接報名。</p>{% if request.query_params.get('error') %}<div class="alert error">{{request.query_params.get('error')}}</div>{% endif %}<form method="post" action="/events" class="form"><label>活動名稱<input required maxlength="100" name="title" placeholder="例如：搖滾台中音樂交流場"></label><label>活動說明<textarea name="description" rows="4" placeholder="說明活動特色及注意事項"></textarea></label><label>活動地點<input name="location" maxlength="150" placeholder="例如：台中市活動空間"></label><label>活動日期與時間<input required name="event_date" type="datetime-local"></label><label>報名截止日期與時間<input required name="registration_deadline" type="datetime-local"></label><button class="button" type="submit">建立活動 →</button></form></div></div>{% endblock %}
