{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
    <section class="panel center">
      <h1 class="h-page">{{ title }}</h1>
      <p>{{ message }}</p>
      {% if detail %}<pre style="text-align:left;white-space:pre-wrap;word-break:break-all;background:#171512;border:1px solid #3b362d;border-radius:6px;padding:12px;color:#ffb3aa;font-size:13px">{{ detail }}</pre>{% endif %}
      <a class="btn" href="/">回到活動列表</a>
    </section>
{% endblock %}
